name: snap_foodd_admin_web
description: Snap Foodd admin web GUI client for the Laravel API.
publish_to: none
version: 0.1.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.2
  google_sign_in: ^6.2.2
  google_sign_in_web: 0.12.4+4
  flutter_svg: ^2.0.10+1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/brand/logo.svg
