name: snap_foodd_delivery_partner
description: "Snap Foodd delivery partner mobile application."
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.8.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.0.0
  go_router: ^16.2.0
  flutter_svg: ^2.2.0
  http: ^1.5.0
  flutter_secure_storage: ^9.2.4
  google_sign_in: ^6.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
