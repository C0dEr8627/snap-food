name: Admin Flutter Web CI

on:
  pull_request:
    paths:
      - "admin_web/**"
      - ".github/workflows/admin-web-ci.yml"
  push:
    branches: [frontend, main]
    paths:
      - "admin_web/**"
      - ".github/workflows/admin-web-ci.yml"
  workflow_dispatch:

jobs:
  admin-web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: admin_web
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Install dependencies
        run: flutter pub get
      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed .
      - name: Analyze
        run: flutter analyze
      - name: Test
        run: flutter test
      - name: Build web
        run: flutter build web --release --dart-define=API_BASE_URL=https://example.invalid/api/v1
