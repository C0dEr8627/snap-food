name: Generate Android launcher icons

on:
  push:
    branches: [frontend]
    paths-ignore:
      - 'android/app/src/main/res/mipmap-*/**'
      - 'android/app/src/main/res/drawable/ic_launcher_foreground.png'
      - 'android/app/src/main/res/values/icon_background.xml'
      - 'android/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml'

permissions:
  contents: write

jobs:
  generate-icons:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: frontend
          fetch-depth: 0

      - name: Install SVG renderer
        run: sudo apt-get update && sudo apt-get install -y librsvg2-bin imagemagick

      - name: Generate launcher PNGs from official SVG
        run: |
          set -euo pipefail
          src="assets/images/customer/logo.svg"
          declare -A sizes=(
            [mdpi]=48
            [hdpi]=72
            [xhdpi]=96
            [xxhdpi]=144
            [xxxhdpi]=192
          )
          for density in "${!sizes[@]}"; do
            size="${sizes[$density]}"
            mkdir -p "android/app/src/main/res/mipmap-${density}"
            tmp="/tmp/logo-${density}.png"
            rsvg-convert -w 1599 -h 1066 -o "$tmp" "$src"
            convert "$tmp" -background none -gravity center -extent "${size}x${size}" "android/app/src/main/res/mipmap-${density}/ic_launcher.png"
          done

          mkdir -p android/app/src/main/res/drawable
          rsvg-convert -w 1599 -h 1066 -o /tmp/logo-foreground.png "$src"
          convert /tmp/logo-foreground.png -background none -gravity center -extent 432x432 android/app/src/main/res/drawable/ic_launcher_foreground.png

      - name: Add adaptive launcher icon resources
        run: |
          set -euo pipefail
          mkdir -p android/app/src/main/res/mipmap-anydpi-v26 android/app/src/main/res/values
          cat > android/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml <<'XML'
          <?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@color/icon_background" />
              <foreground android:drawable="@drawable/ic_launcher_foreground" />
          </adaptive-icon>
          XML
          cat > android/app/src/main/res/values/icon_background.xml <<'XML'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <color name="icon_background">#FFF8F5</color>
          </resources>
          XML

      - name: Commit generated icons
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add android/app/src/main/res
          if git diff --cached --quiet; then
            echo "No launcher icon changes to commit."
            exit 0
          fi
          git commit -m "chore(android): generate branded launcher resources"
          git push origin frontend
